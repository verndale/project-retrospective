name: Sync wiki issue state

on:
  schedule:
    - cron: "30 11 * * *" # Daily at 11:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: wiki-issue-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRAPHIFY_SKIP_HOOK: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require bot token
        run: |
          test -n "$GH_TOKEN" || { echo '::error::PR_BOT_TOKEN is required'; exit 1; }
          gh auth setup-git

      - name: Refresh issue state
        id: refresh
        run: |
          base="$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')"
          branch="bot/wiki-issue-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$base"
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git checkout -B "$branch" "origin/$base"
          node scripts/wiki/refresh-issue-state.cjs
          pnpm run graph:build
          pnpm run wiki:check
          pnpm run graph:check
          git add -- wiki scripts/graph/data/graph.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No issue-state changes."
            exit 0
          fi
          git commit -m "docs(wiki): refresh cited issue state"
          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open, update, or reopen review PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ steps.refresh.outputs.base }}
          BOT_BRANCH: ${{ steps.refresh.outputs.branch }}
        run: |
          title="docs(wiki): refresh cited issue state"
          body="Automated, reviewable refresh of cited GitHub issue state."
          open="$(gh pr list --base "$BASE_BRANCH" --head "$BOT_BRANCH" --state open --limit 100 --json number --jq 'sort_by(.number) | last | .number // empty')"
          closed="$(gh pr list --base "$BASE_BRANCH" --head "$BOT_BRANCH" --state closed --limit 100 --json number,mergedAt --jq 'map(select(.mergedAt == null)) | sort_by(.number) | last | .number // empty')"
          if [ -n "$open" ]; then
            review="$open"
          elif [ -n "$closed" ]; then
            gh pr reopen "$closed"
            review="$closed"
          else
            gh pr create --base "$BASE_BRANCH" --head "$BOT_BRANCH" --title "$title" --body "$body"
            exit 0
          fi
          gh pr edit "$review" --title "$title" --body "$body"
          if [ "$(gh pr view "$review" --json isDraft --jq '.isDraft')" = "true" ]; then gh pr ready "$review"; fi
