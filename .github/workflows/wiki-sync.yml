name: Sync context wiki

# Reconcile offline evidence from a merged PR into Markdown, rebuild this
# repository's curated graph, and open a review PR. Manual dispatch replays an
# already-merged PR; no durable PR snapshot or live viewer API is created.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged pull request number to replay"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wiki-sync-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRAPHIFY_SKIP_HOOK: "1"
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'bot/wiki-'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require bot token
        run: |
          test -n "$GH_TOKEN" || { echo '::error::PR_BOT_TOKEN is required'; exit 1; }
          gh auth setup-git

      - name: Build merged PR context
        id: context
        run: |
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/wiki-pr.json"
          jq -e '.merged == true and .merged_at != null' "$RUNNER_TEMP/wiki-pr.json" > /dev/null \
            || { echo "PR #${PR_NUMBER} is not merged"; exit 1; }
          jq -e '(.head.ref | startswith("bot/wiki-") | not)' "$RUNNER_TEMP/wiki-pr.json" > /dev/null \
            || { echo "Refusing to replay bot wiki PR #${PR_NUMBER}"; exit 1; }

          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --slurp \
            | jq -c 'map(.[] | .filename)' > "$RUNNER_TEMP/wiki-files.json"
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits?per_page=100" --paginate --slurp \
            | jq -c 'map(.[] | {hash: .sha, subject: (.commit.message | split("\n")[0])})' > "$RUNNER_TEMP/wiki-commits.json"

          jq -n \
            --arg repository "${{ github.repository }}" \
            --slurpfile pr "$RUNNER_TEMP/wiki-pr.json" \
            --slurpfile files "$RUNNER_TEMP/wiki-files.json" \
            --slurpfile commits "$RUNNER_TEMP/wiki-commits.json" \
            '{schemaVersion: 1, repository: $repository, number: $pr[0].number, title: $pr[0].title, body: ($pr[0].body // ""), url: $pr[0].html_url, mergedAt: $pr[0].merged_at, changedPaths: $files[0], commits: $commits[0]}' \
            > "$RUNNER_TEMP/wiki-merge.json"
          echo "base_branch=$(jq -r '.base.ref' "$RUNNER_TEMP/wiki-pr.json")" >> "$GITHUB_OUTPUT"

      - name: Sync wiki
        id: sync
        env:
          BASE_BRANCH: ${{ steps.context.outputs.base_branch }}
          WIKI_AI: ${{ vars.WIKI_AI }}
          WIKI_AI_ENDPOINT: ${{ vars.WIKI_AI_ENDPOINT }}
          WIKI_AI_MODEL: ${{ vars.WIKI_AI_MODEL }}
          WIKI_AI_API_KEY: ${{ secrets.WIKI_AI_API_KEY }}
          RELEASE_NOTES_AI_ENDPOINT: ${{ vars.RELEASE_NOTES_AI_ENDPOINT }}
          RELEASE_NOTES_AI_MODEL: ${{ vars.RELEASE_NOTES_AI_MODEL }}
          RELEASE_NOTES_AI_API_KEY: ${{ secrets.RELEASE_NOTES_AI_API_KEY }}
        run: |
          branch="bot/wiki-sync/${PR_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_BRANCH"
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git checkout -B "$branch" "origin/${BASE_BRANCH}"
          node scripts/wiki/on-merge-sync.cjs --context "$RUNNER_TEMP/wiki-merge.json"
          pnpm run graph:build
          pnpm run wiki:check
          pnpm run graph:check
          git add -- wiki scripts/graph/data/graph.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No wiki changes for ${GITHUB_REPOSITORY}#${PR_NUMBER}."
            exit 0
          fi
          git commit -m "docs(wiki): reconcile merged PR #${PR_NUMBER}"
          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open, update, or reopen review PR
        if: steps.sync.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ steps.context.outputs.base_branch }}
          BOT_BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          title="docs(wiki): reconcile merged PR #${PR_NUMBER}"
          body="Automated, reviewable wiki reconciliation for merged PR #${PR_NUMBER}."
          open="$(gh pr list --base "$BASE_BRANCH" --head "$BOT_BRANCH" --state open --limit 100 --json number --jq 'sort_by(.number) | last | .number // empty')"
          closed="$(gh pr list --base "$BASE_BRANCH" --head "$BOT_BRANCH" --state closed --limit 100 --json number,mergedAt --jq 'map(select(.mergedAt == null)) | sort_by(.number) | last | .number // empty')"
          if [ -n "$open" ]; then
            review="$open"
          elif [ -n "$closed" ]; then
            gh pr reopen "$closed"
            review="$closed"
          else
            gh pr create --base "$BASE_BRANCH" --head "$BOT_BRANCH" --title "$title" --body "$body"
            exit 0
          fi
          gh pr edit "$review" --title "$title" --body "$body"
          if [ "$(gh pr view "$review" --json isDraft --jq '.isDraft')" = "true" ]; then gh pr ready "$review"; fi
